<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Client Onboarding · Never Miss a Call</title>
<style>
  :root{
    --bg:#10130f; --panel:#181c15; --card:#1f241b; --line:#2e3626;
    --ink:#f2f0e6; --muted:#9aa389; --amber:#e0a53f; --amber-deep:#b8842a;
    --ok:#8fbf6b; --danger:#d5714f;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;
    padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  header{padding:16px 18px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    position:sticky;top:0;background:var(--bg);z-index:20}
  header .brand{font-weight:800;font-size:15px}
  header .brand span{color:var(--amber)}
  .wrap{max-width:620px;margin:0 auto;padding:18px 16px}

  button{font-family:var(--sans);cursor:pointer;border:0;border-radius:10px;font-weight:700;font-size:16px}
  .btn-primary{background:var(--amber);color:#1a1405;padding:15px 20px;width:100%}
  .btn-primary:disabled{opacity:.4}
  .btn-primary:active{transform:translateY(1px)}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);padding:12px 16px}
  .btn-sm{padding:9px 14px;font-size:13px;width:auto}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--line);padding:9px 13px;font-size:13px}

  input,textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:14px;font-size:17px;font-family:var(--sans)}
  textarea{resize:vertical;min-height:64px;line-height:1.5}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
  .err{color:var(--danger);font-size:13px;min-height:18px;font-family:var(--mono);margin-top:8px}

  .login{max-width:340px;margin:16vh auto 0;text-align:center;padding:0 20px}
  .login .kick{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber)}
  .login h1{font-size:22px;margin:6px 0 20px}
  .login input{margin-bottom:12px}

  .progress{display:flex;gap:6px;margin:4px 0 22px}
  .progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
  .progress i.on{background:var(--amber)}
  .stepnum{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);font-weight:700}
  h2.step{font-size:24px;margin:6px 0 6px;letter-spacing:-.01em;line-height:1.25}
  p.lead{color:var(--muted);font-size:15px;line-height:1.55;margin:0 0 18px}

  .action{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--amber);
    border-radius:12px;padding:18px;margin:16px 0}
  .action .what{font-size:16px;font-weight:700;margin-bottom:10px}
  a.biglink{display:block;background:var(--amber);color:#1a1405;text-decoration:none;text-align:center;
    font-weight:800;font-size:16px;padding:15px;border-radius:10px;margin:10px 0}
  a.biglink:active{transform:translateY(1px)}
  .copyrow{display:flex;gap:8px;align-items:stretch;margin:10px 0}
  .copyrow code{flex:1;background:#0c0e0a;border:1px solid var(--line);border-radius:8px;
    padding:13px;font-family:var(--mono);font-size:13px;color:var(--amber);
    overflow-x:auto;white-space:nowrap;display:flex;align-items:center}
  .copyrow button{flex-shrink:0;background:var(--ink);color:var(--bg);padding:0 18px;font-size:14px}
  .navrow{display:flex;gap:10px;margin-top:22px}
  .navrow .btn-ghost{flex:0 0 auto}
  .navrow .btn-primary{flex:1}
  .hint{font-size:13px;color:var(--muted);line-height:1.5;margin-top:10px}
  .hide{display:none}

  .carriers{width:100%;border-collapse:collapse;margin:8px 0}
  .carriers td{border:1px solid var(--line);padding:11px 12px;font-size:14px;vertical-align:top}
  .carriers td:first-child{color:var(--muted);white-space:nowrap;font-weight:600}
  .carriers code{font-family:var(--mono);color:var(--amber);font-size:14px;word-break:break-all}

  .check{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:14px;margin:10px 0;font-size:15px;line-height:1.45;cursor:pointer}
  .check input{width:22px;height:22px;flex-shrink:0;accent-color:var(--amber);margin-top:1px}

  .toolbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}
  .toolbar h2{margin:0;font-size:20px}
  .client{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:11px;
    display:flex;align-items:center;justify-content:space-between;gap:12px}
  .client .name{font-weight:700;font-size:16px}
  .client .meta{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:3px}
  .client .actions{display:flex;gap:8px;flex-shrink:0}
  .empty{border:1px dashed var(--line);border-radius:12px;padding:34px 20px;text-align:center;color:var(--muted)}

  /* tabs */
  .tabs{display:flex;gap:6px;padding:0 16px;border-bottom:1px solid var(--line);
    position:sticky;top:57px;background:var(--bg);z-index:19}
  .tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
    padding:13px 6px;margin-right:14px;font-size:15px;font-weight:700;border-radius:0}
  .tabs button.on{color:var(--amber);border-bottom-color:var(--amber)}
  .tabs .count{font-family:var(--mono);font-size:12px;opacity:.7;margin-left:5px}

  /* prospect cards */
  .finder{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .finder .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:520px){.finder .row2{grid-template-columns:1fr}}
  .finder input{padding:11px;font-size:15px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch}
  .chips button{flex-shrink:0;background:var(--card);border:1px solid var(--line);color:var(--muted);
    padding:7px 13px;font-size:13px;border-radius:999px;font-weight:600}
  .chips button.on{background:var(--amber);color:#1a1405;border-color:var(--amber)}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px;
    margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .pcard:active{transform:scale(.995)}
  .pcard .nm{font-weight:700;font-size:16px;line-height:1.3}
  .pcard .sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px}
  .badge{flex-shrink:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
    font-weight:700;padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .badge.new{color:var(--amber);border-color:var(--amber)}
  .badge.callback{color:#e0a53f}
  .badge.demo{color:#8fbf6b;border-color:var(--ok)}
  .badge.won{background:var(--ok);color:#12200a;border-color:var(--ok)}
  .badge.dead{opacity:.5}

  /* prospect detail */
  .pinfo{display:grid;gap:7px;margin:14px 0;font-size:14.5px}
  .pinfo div{display:flex;gap:10px}
  .pinfo b{color:var(--muted);font-weight:600;min-width:74px;flex-shrink:0}
  a.callbtn{display:block;background:var(--ok);color:#12200a;text-decoration:none;text-align:center;
    font-weight:800;font-size:19px;padding:17px;border-radius:12px;margin:14px 0}
  a.callbtn:active{transform:translateY(1px)}
  .outcomes{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 4px}
  .outcomes button{background:var(--card);border:1px solid var(--line);color:var(--ink);
    padding:9px 13px;font-size:13.5px;border-radius:9px;font-weight:600}
  .outcomes button.on{background:var(--amber);color:#1a1405;border-color:var(--amber)}
  .history{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
  .hitem{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin-bottom:8px}
  .hitem .when{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:5px}
  .hitem .txt{font-size:14px;line-height:1.45;white-space:pre-wrap}

  /* live call script */
  .scriptbar{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 0 14px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .scriptbar .who{font-weight:700;font-size:15px;line-height:1.25}
  .scriptbar .who span{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);
    letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
  .stage{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--amber);font-weight:700;margin-bottom:9px}
  .stage.close{color:var(--ok)} .stage.schedule{color:var(--amber)} .stage.exit{color:var(--muted)}
  .sayblock{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--amber);
    border-radius:14px;padding:19px}
  .sayblock.close{border-left-color:var(--ok)}
  .sayblock.exit{border-left-color:var(--muted)}
  .saylabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--muted);margin-bottom:9px}
  .sayline{font-size:21px;line-height:1.45;font-weight:600;letter-spacing:-.01em}
  .why{display:flex;gap:9px;margin-top:15px;padding-top:14px;border-top:1px solid var(--line);
    font-size:13.5px;line-height:1.5;color:var(--muted)}
  .why b{color:var(--amber);flex-shrink:0}
  .theysay{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);margin:20px 0 9px}
  .opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
    color:var(--ink);border-radius:11px;padding:14px 15px;margin-bottom:9px;font-size:15.5px;
    font-weight:600;line-height:1.35}
  .opt:active{transform:scale(.995);border-color:var(--amber)}
  .nextlist{margin:16px 0 0;padding:0;list-style:none}
  .nextlist li{background:var(--card);border:1px solid var(--line);border-radius:9px;
    padding:11px 13px;margin-bottom:7px;font-size:14.5px;line-height:1.4}
  .signals{margin-top:22px;border:1px dashed var(--line);border-radius:11px;padding:14px}
  .signals .t{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ok);font-weight:700;margin-bottom:8px}
  .signals li{font-size:13.5px;color:var(--muted);line-height:1.5;margin-bottom:4px}
  .empty b{color:var(--ink);display:block;margin-bottom:5px;font-size:16px}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="kick">Never Miss a Call</div>
  <h1>Onboarding</h1>
  <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password"/>
  <button class="btn-primary" id="loginBtn">Unlock</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="app" class="hide">
  <header>
    <div class="brand">Never Miss a Call</div>
    <button class="btn-primary btn-sm" id="newBtn" style="width:auto">+ Onboard</button>
  </header>
  <div class="tabs">
    <button id="tabCalls" class="on" onclick="showCallList()">Call list<span class="count" id="cCalls"></span></button>
    <button id="tabClients" onclick="showList()">Clients<span class="count" id="cClients"></span></button>
  </div>
  <div class="wrap" id="view"></div>
</div>

<script src="/script-tree.js"></script>
<script>
const $ = (s,r=document)=>r.querySelector(s);
let pw = sessionStorage.getItem("adminpw") || "";
const HOST = location.host;

async function api(path, opts={}){
  return fetch(path, {...opts, headers:{ "Content-Type":"application/json", "x-admin-password": pw, ...(opts.headers||{}) }});
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function copy(text, btn){ navigator.clipboard.writeText(text).then(()=>{ const t=btn.textContent; btn.textContent="✓ Copied"; setTimeout(()=>btn.textContent=t,1600); }); }

// ---------- auth ----------
$("#loginBtn").onclick = async () => {
  const val = $("#pw").value;
  const r = await fetch("/clients/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pw:val})});
  if(r.ok){ pw=val; sessionStorage.setItem("adminpw",pw); enter(); } else $("#loginErr").textContent="Wrong password.";
};
$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("#loginBtn").click()});
function enter(){ $("#login").classList.add("hide"); $("#app").classList.remove("hide"); showCallList(); }

// ---------- wizard state ----------
let wiz = {};
function resetWiz(){ wiz = { num:"", webhookDone:false, client:null, prospect:null }; }

const TOTAL = 6;
function chrome(step, title, lead){
  let bars=""; for(let i=1;i<=TOTAL;i++) bars+=`<i class="${i<=step?'on':''}"></i>`;
  return `<div class="progress">${bars}</div>
    <div class="stepnum">Step ${step} of ${TOTAL}</div>
    <h2 class="step">${title}</h2>
    <p class="lead">${lead}</p>`;
}
function nav(backFn, nextLabel, nextFn, nextDisabled){
  return `<div class="navrow">
    ${backFn?`<button class="btn-ghost" onclick="${backFn}()">‹ Back</button>`:""}
    <button class="btn-primary" id="nextBtn" ${nextDisabled?"disabled":""} onclick="${nextFn}()">${nextLabel}</button>
  </div>`;
}

// ---------- STEP 1 ----------
function step1(){
  $("#view").innerHTML = chrome(1,"Buy their Twilio number","One number per client. Get one in their area code.") + `
    <div class="action">
      <div class="what">1 · Open Twilio's buy-a-number page:</div>
      <a class="biglink" href="https://console.twilio.com/us1/develop/phone-numbers/manage/search" target="_blank">Open Twilio → Buy a Number ↗</a>
      <div class="hint">Search their area code (503 / 360) → pick one with <b>Voice + SMS</b> → Buy. ~$1/mo.</div>
    </div>
    <div class="action">
      <div class="what">2 · Paste the number you just bought:</div>
      <input id="wNum" placeholder="+1 503 555 0123" inputmode="tel" value="${esc(wiz.num)}" oninput="wiz.num=this.value; $('#nextBtn').disabled=!this.value.trim()"/>
    </div>
    ${nav("showList","Next ›","step2", !wiz.num.trim())}`;
}

// ---------- STEP 2 ----------
function step2(){
  $("#view").innerHTML = chrome(2,"Point the number at the app","Tell Twilio to send that number's calls to your receptionist.") + `
    <div class="action">
      <div class="what">1 · Open your numbers list and click <b>${esc(wiz.num||"the new number")}</b>:</div>
      <a class="biglink" href="https://console.twilio.com/us1/develop/phone-numbers/manage/incoming" target="_blank">Open Twilio → Active Numbers ↗</a>
    </div>
    <div class="action">
      <div class="what">2 · Under <b>Voice → "A call comes in"</b> choose <b>Webhook</b>, paste this, method <b>HTTP POST</b>, hit Save:</div>
      <div class="copyrow">
        <code>https://${esc(HOST)}/incoming-call</code>
        <button onclick="copy('https://${esc(HOST)}/incoming-call', this)">Copy</button>
      </div>
    </div>
    <label class="check"><input type="checkbox" ${wiz.webhookDone?"checked":""} onchange="wiz.webhookDone=this.checked; $('#nextBtn').disabled=!this.checked"/>
      I pasted the webhook and hit Save in Twilio</label>
    ${nav("step1","Next ›","step3", !wiz.webhookDone)}`;
}

// ---------- STEP 3 ----------
function step3(){
  const pr = wiz.prospect || {};
  $("#view").innerHTML = chrome(3,"Add their business info",
    pr.businessName
      ? `Carried over from your call list — check it and fill in the rest.`
      : "Paste their website first — it fills most of this for you.") + `
    <div class="action">
      <div class="what">⚡ Autofill (do this first)</div>
      <input id="f_website" placeholder="their website — e.g. davesplumbing.com" inputmode="url"/>
      <button class="btn-primary" style="margin-top:10px" id="autofillBtn" onclick="runAutofill()">⚡ Autofill from website</button>
      <div class="err" id="autofillStatus" style="color:var(--muted)"></div>
    </div>
    <input type="hidden" id="f_websiteInfo"/>
    <label>Business name *</label><input id="f_businessName"/>
    <label>Owner's first name *</label><input id="f_ownerName"/>
    <label>Owner's cell — leads get texted here *</label><input id="f_ownerCell" inputmode="tel" placeholder="+1 503 555 0123"/>
    <label>Trade</label><input id="f_trade" placeholder="plumbing"/>
    <label>City</label><input id="f_city"/>
    <label>Service area</label><input id="f_serviceArea"/>
    <label>Hours</label><input id="f_hours" placeholder="Mon–Fri 7am–5pm"/>
    <label class="check" style="margin-top:14px"><input type="checkbox" id="f_emergency"/> Handles after-hours emergencies</label>
    <label>Services offered (one per line)</label><textarea id="f_services"></textarea>
    <label>Does NOT do (politely declines)</label><textarea id="f_doesNotDo"></textarea>
    <label>Questions the assistant should ask callers (one per line — leave blank for sensible defaults)</label>
    <textarea id="f_bookingQuestions" placeholder="their name&#10;the best callback number&#10;the service address&#10;what they need help with&#10;how urgent it is"></textarea>
    <div class="err" id="formErr"></div>
    ${nav("step2","Save & continue ›","saveClient", false)}`;

  // prefill anything we already know from the call list
  if (pr.businessName) $("#f_businessName").value = pr.businessName;
  if (pr.trade)        $("#f_trade").value        = pr.trade;
  if (pr.city)         $("#f_city").value         = pr.city;
  if (pr.city)         $("#f_serviceArea").value  = pr.city;
  if (pr.website)      $("#f_website").value      = pr.website;
}

async function runAutofill(){
  const website = $("#f_website").value.trim();
  if(!website){ $("#autofillStatus").textContent="Enter their website first."; return; }
  $("#autofillBtn").disabled = true;
  $("#autofillStatus").style.color="var(--muted)";
  $("#autofillStatus").textContent = "Reading their site…";
  try{
    const r = await api("/clients/api/autofill",{method:"POST",body:JSON.stringify({website})});
    const d = await r.json();
    $("#autofillBtn").disabled = false;
    if(!r.ok || !d.foundSite){ $("#autofillStatus").textContent = "Site didn't load — fill fields manually (still works fine)."; return; }
    const f = d.fields||{};
    const set=(id,v)=>{ if(v && !$(id).value) $(id).value=v; };
    set("#f_businessName",f.businessName); set("#f_trade",f.trade); set("#f_ownerName",f.ownerName);
    set("#f_city",f.city); set("#f_serviceArea",f.serviceArea); set("#f_hours",f.hours);
    if(f.services && f.services.length && !$("#f_services").value) $("#f_services").value=f.services.join("\n");
    if(f.doesNotDo && f.doesNotDo.length && !$("#f_doesNotDo").value) $("#f_doesNotDo").value=f.doesNotDo.join("\n");
    $("#f_websiteInfo").value = d.websiteInfo||"";
    $("#autofillStatus").style.color="var(--ok)";
    $("#autofillStatus").textContent = "✓ Filled what it found. Finish the starred fields.";
  }catch(e){ $("#autofillBtn").disabled=false; $("#autofillStatus").textContent="Couldn't read the site — fill manually."; }
}

async function saveClient(){
  $("#formErr").textContent="";
  const payload = {
    businessName: $("#f_businessName").value, ownerName: $("#f_ownerName").value,
    ownerCell: $("#f_ownerCell").value, twilioNumber: wiz.num,
    trade: $("#f_trade").value, city: $("#f_city").value,
    serviceArea: $("#f_serviceArea").value, hours: $("#f_hours").value,
    emergencyAvailable: $("#f_emergency").checked,
    services: $("#f_services").value, doesNotDo: $("#f_doesNotDo").value,
    bookingQuestions: $("#f_bookingQuestions").value,
    website: $("#f_website").value, websiteInfo: $("#f_websiteInfo").value,
    prospectId: (wiz.prospect && wiz.prospect.id) || undefined,
  };
  const r = await api("/clients/api/clients",{method:"POST",body:JSON.stringify(payload)});
  const d = await r.json();
  if(!r.ok){ $("#formErr").textContent = d.error||"Something went wrong."; return; }
  wiz.client = d.client;
  step4();
}

// ---------- STEP 4 ----------
function step4(){
  const digits = String(wiz.client.twilioNumber).replace(/\D/g,"");
  $("#view").innerHTML = chrome(4,"Forward their real line","Their phone rings first — only unanswered calls hit the AI. The owner dials ONE code on THEIR phone.") + `
    <div class="action">
      <div class="what">Ask: "Who's your cell carrier?" — then have them dial:</div>
      <table class="carriers">
        <tr><td>AT&amp;T /<br>T-Mobile</td><td><code>**004*${digits}#</code> <button class="btn-ghost btn-sm" onclick="copy('**004*${digits}#',this)">Copy</button></td></tr>
        <tr><td>Verizon</td><td><code>*71${digits}</code> <button class="btn-ghost btn-sm" onclick="copy('*71${digits}',this)">Copy</button><div class="hint">Or My Verizon app → Call Forwarding → "No Answer/Busy Transfer". Never *72.</div></td></tr>
        <tr><td>VoIP /<br>landline</td><td>Their provider's app → <b>"forward on no answer"</b> → to <code>${esc(wiz.client.twilioNumber)}</code></td></tr>
      </table>
      <div class="hint">Undo later: <code>##002#</code> (AT&amp;T/T-Mobile) · <code>*73</code> (Verizon)</div>
    </div>
    <div class="action" style="border-left-color:var(--danger)">
      <div class="what">⚠️ Still going to voicemail? (iPhone + Verizon)</div>
      <div class="hint"><b>iPhone Live Voicemail blocks call forwarding.</b> Have them go to
      <b>Settings → Phone → Live Voicemail → OFF</b>, then dial <code>*73</code> to reset,
      then re-dial the forwarding code. This fixes it almost every time.<br><br>
      Also: Verizon does NOT support iPhone's Settings → Phone → Call Forwarding toggle —
      dial codes only. Wait 2–3 sec after dialing for the confirmation tone.</div>
    </div>
    <label class="check"><input type="checkbox" onchange="$('#nextBtn').disabled=!this.checked"/> They dialed it (or set it in their app)</label>
    ${nav(null,"Next ›","step5", true)}`;
}

// ---------- STEP 5 ----------
function step5(){
  $("#view").innerHTML = chrome(5,"Test it — right now","Two quick calls prove the whole thing works. Don't skip this.") + `
    <div class="action">
      <div class="what">1 · Call their REAL business number. Let it ring — don't answer.</div>
      <div class="hint">After ~20–25 sec it forwards and the AI answers as ${esc(wiz.client.businessName)}. Give it a fake job (name, number, problem).</div>
    </div>
    <div class="action">
      <div class="what">2 · Open their board — the fake lead should appear:</div>
      <a class="biglink" href="https://${esc(HOST)}/d/${esc(wiz.client.dashToken)}" target="_blank">Open their live job board ↗</a>
    </div>
    <div class="action">
      <div class="what">3 · Call again and ANSWER it yourself.</div>
      <div class="hint">The AI should NOT pick up — proves their phone still rings first.</div>
    </div>
    <label class="check"><input type="checkbox" onchange="$('#nextBtn').disabled=!this.checked"/> All three checks passed</label>
    ${nav(null,"Next ›","step6", true)}`;
}

// ---------- STEP 6 ----------
function step6(){
  const dash = `https://${HOST}/d/${wiz.client.dashToken}`;
  const pay = localStorage.getItem("stripeLink") || "";
  $("#view").innerHTML = chrome(6,"Send them two links","Text these to the owner and you're done.") + `
    <div class="action">
      <div class="what">Their private job board:</div>
      <div class="copyrow"><code>${esc(dash)}</code><button onclick="copy('${esc(dash)}',this)">Copy</button></div>
      <div class="hint">Every lead the AI catches shows up here. Tell them to bookmark it.</div>
    </div>
    <div class="action">
      <div class="what">Your Stripe payment link ($299/mo):</div>
      <input id="payLink" placeholder="paste your Stripe link once — it's remembered" value="${esc(pay)}"
        oninput="localStorage.setItem('stripeLink', this.value)"/>
      <button class="btn-ghost" style="margin-top:10px;width:100%" onclick="copy($('#payLink').value,this)">Copy payment link</button>
    </div>
    <div class="action" style="border-left-color:var(--ok)">
      <div class="what" style="color:var(--ok)">✓ ${esc(wiz.client.businessName)} is live.</div>
      <div class="hint">Check in day 2 ("working okay?") and day 7 ("here's what it caught"). That's what keeps them paying.</div>
    </div>
    <div class="navrow"><button class="btn-primary" onclick="showList()">Done</button></div>`;
}


// ============================ CALL LIST ============================
let prospectFilter = "all";
let prospectCache = [];
let canSearchWeb = false;

function setTab(which){
  document.getElementById("tabCalls").className  = which==="calls"   ? "on" : "";
  document.getElementById("tabClients").className= which==="clients" ? "on" : "";
}

const STATUS_LABEL = { new:"Not called", called:"Called", callback:"Call back",
                       demo:"Demo booked", won:"Client", dead:"Not interested" };

async function showCallList(){
  setTab("calls");
  const r = await api("/clients/api/prospects");
  if(r.status===401){ sessionStorage.removeItem("adminpw"); location.reload(); return; }
  const d = await r.json();
  prospectCache = d.prospects || [];
  canSearchWeb = !!d.canSearchWeb;
  const st = d.stats || {};
  $("#cCalls").textContent = st.new != null ? st.new : "";
  renderCallList(st);
}

function renderCallList(st){
  const counts = st || {};
  const chip = (key,label) => `<button class="${prospectFilter===key?"on":""}" onclick="prospectFilter='${key}';renderCallList()">${label}${counts[key]!=null?` (${counts[key]})`:""}</button>`;
  const list = prospectCache.filter(p => prospectFilter==="all" || p.status===prospectFilter);

  const finder = canSearchWeb
    ? `<div class="finder">
         <div class="what" style="font-weight:700;margin-bottom:8px">Find more businesses</div>
         <div class="row2">
           <input id="findTrade" placeholder="plumbers" value="plumbers"/>
           <input id="findArea" placeholder="Vancouver WA"/>
         </div>
         <button class="btn-primary" style="margin-top:9px" id="findBtn" onclick="findMore()">Search the web</button>
         <div class="err" id="findStatus" style="color:var(--muted)"></div>
       </div>`
    : `<div class="finder">
         <div style="font-weight:700;margin-bottom:6px">Add a business</div>
         <div class="row2">
           <input id="mName" placeholder="Business name"/>
           <input id="mPhone" placeholder="Phone" inputmode="tel"/>
         </div>
         <div class="row2" style="margin-top:8px">
           <input id="mTrade" placeholder="plumbing"/>
           <input id="mCity" placeholder="Vancouver, WA"/>
         </div>
         <button class="btn-primary" style="margin-top:9px" onclick="addManual()">Add to call list</button>
         <div class="hint">Set GOOGLE_PLACES_API_KEY to pull businesses from the web automatically.</div>
         <div class="err" id="findStatus" style="color:var(--muted)"></div>
       </div>`;

  const rows = list.length ? list.map(p => `
      <div class="pcard" onclick="showProspect('${p.id}')">
        <div>
          <div class="nm">${esc(p.businessName)}</div>
          <div class="sub">${esc(p.phone||"no phone")}${p.city?" · "+esc(p.city):""}${p.reviewCount!=null?` · ${p.reviewCount} reviews`:""}</div>
        </div>
        <span class="badge ${p.status}">${STATUS_LABEL[p.status]||p.status}</span>
      </div>`).join("")
    : `<div class="empty"><b>Nothing here.</b>${prospectFilter==="all"?"Add businesses above to start calling.":"No businesses with that status."}</div>`;

  $("#view").innerHTML = finder + `
    <div class="chips">
      ${chip("all","All")}${chip("new","Not called")}${chip("callback","Call back")}
      ${chip("called","Called")}${chip("demo","Demo")}${chip("won","Clients")}${chip("dead","Dead")}
    </div>` + rows;
}

async function findMore(){
  const trade = $("#findTrade").value.trim(), area = $("#findArea").value.trim();
  if(!trade || !area){ $("#findStatus").textContent="Enter a trade and an area."; return; }
  $("#findBtn").disabled = true;
  $("#findStatus").style.color="var(--muted)";
  $("#findStatus").textContent = "Searching…";
  try{
    const r = await api("/clients/api/prospects/search",{method:"POST",body:JSON.stringify({trade,area})});
    const d = await r.json();
    $("#findBtn").disabled = false;
    if(!r.ok){ $("#findStatus").style.color="var(--danger)"; $("#findStatus").textContent=d.error||"Search failed."; return; }
    $("#findStatus").style.color="var(--ok)";
    $("#findStatus").textContent = `Found ${d.found}, added ${d.added} new.`;
    showCallList();
  }catch(e){ $("#findBtn").disabled=false; $("#findStatus").textContent="Search failed."; }
}

async function addManual(){
  const body = { businessName:$("#mName").value, phone:$("#mPhone").value,
                 trade:$("#mTrade").value, city:$("#mCity").value, source:"manual" };
  if(!body.businessName.trim()){ $("#findStatus").textContent="Business name required."; return; }
  const r = await api("/clients/api/prospects",{method:"POST",body:JSON.stringify(body)});
  const d = await r.json();
  if(!r.ok){ $("#findStatus").style.color="var(--danger)"; $("#findStatus").textContent=d.error||"Failed."; return; }
  showCallList();
}

let currentProspect = null;
let pendingStatus = null;

async function showProspect(id){
  const r = await api("/clients/api/prospects/"+id);
  if(!r.ok){ showCallList(); return; }
  const p = await r.json();
  currentProspect = p; pendingStatus = null;
  const tel = "tel:"+(p.phone||"").replace(/[^+\d]/g,"");
  const hist = (p.calls||[]).map(c=>`
      <div class="hitem">
        <div class="when">${new Date(c.at).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})} · ${STATUS_LABEL[c.status]||c.status}</div>
        <div class="txt">${esc(c.notes)}</div>
      </div>`).join("");

  $("#view").innerHTML = `
    <button class="btn-ghost btn-sm" onclick="showCallList()">‹ Back to call list</button>
    <h2 class="step" style="margin-top:14px">${esc(p.businessName)}</h2>
    <div class="pinfo">
      <div><b>Phone</b> ${esc(p.phone||"—")}</div>
      <div><b>Trade</b> ${esc(p.trade||"—")}</div>
      <div><b>Where</b> ${esc(p.address||p.city||"—")}</div>
      <div><b>Reviews</b> ${p.rating!=null?`${p.rating}★ · ${p.reviewCount} reviews`:"—"}</div>
      ${p.website?`<div><b>Website</b> <a href="${esc(p.website)}" target="_blank" style="color:var(--amber)">${esc(p.website)}</a></div>`:""}
      <div><b>Status</b> ${STATUS_LABEL[p.status]||p.status}${p.lastCalledAt?` · last called ${new Date(p.lastCalledAt).toLocaleDateString()}`:""}</div>
    </div>
    ${p.phone?`<a class="callbtn" href="${tel}">📞 Call ${esc(p.phone)}</a>`:""}

    <label>How did it go?</label>
    <textarea id="callNotes" placeholder="What they said, objections, when to follow up…" style="min-height:110px"></textarea>
    <div class="outcomes" id="outcomes">
      ${["called","callback","demo","dead"].map(k=>`<button data-s="${k}" onclick="pickStatus('${k}')">${STATUS_LABEL[k]}</button>`).join("")}
    </div>
    <button class="btn-primary" style="margin-top:10px" id="saveCall" onclick="submitCall()">Submit — mark as called</button>
    <div class="err" id="callErr"></div>

    <button class="btn-primary" style="margin-top:16px" onclick="openScript()">📋 Open live call script</button>
    <button class="btn-ghost" style="width:100%;margin-top:10px" onclick="onboardFromProspect()">→ Onboard ${esc(p.businessName)} as a client</button>

    ${hist?`<div class="history"><div class="stepnum">Call history</div>${hist}</div>`:""}`;
}

window.pickStatus = (k)=>{
  pendingStatus = pendingStatus===k ? null : k;
  document.querySelectorAll("#outcomes button").forEach(b=>{
    b.className = b.dataset.s===pendingStatus ? "on" : "";
  });
};

async function submitCall(){
  if(!currentProspect) return;
  $("#saveCall").disabled = true;
  const r = await api(`/clients/api/prospects/${currentProspect.id}/log`,
    {method:"POST", body: JSON.stringify({ notes: $("#callNotes").value, status: pendingStatus || "called" })});
  const d = await r.json();
  $("#saveCall").disabled = false;
  if(!r.ok){ $("#callErr").textContent = d.error||"Couldn't save."; return; }
  showCallList();
}

function onboardFromProspect(){
  if(!currentProspect) return;
  resetWiz();
  wiz.prospect = currentProspect;
  step1();
}


// ====================== LIVE CALL SCRIPT ======================
let scriptStack = [];          // history for the Back button
let scriptProspect = null;

function fill(t){
  const biz = (scriptProspect && scriptProspect.businessName) || "your shop";
  const own = (scriptProspect && scriptProspect.ownerName) || "";
  return String(t).replace(/\{BIZ\}/g, biz).replace(/\{OWNER\}/g, own);
}

function openScript(){
  if(!currentProspect) return;
  scriptProspect = currentProspect;
  scriptStack = [];
  renderScript("dial");
}

function scriptGo(id){
  const cur = scriptStack[scriptStack.length-1];
  if(cur && cur !== id) scriptStack.push(id); else if(!cur) scriptStack.push(id);
  renderScript(id, true);
}

function scriptBack(){
  scriptStack.pop();
  const prev = scriptStack[scriptStack.length-1];
  if(prev) renderScript(prev); else renderScript("dial");
}

function renderScript(id, pushed){
  const n = window.CALL_SCRIPT[id];
  if(!n){ showProspect(scriptProspect.id); return; }
  if(!pushed && scriptStack[scriptStack.length-1] !== id) scriptStack.push(id);

  const kind = n.kind || "";
  const opts = (n.options||[]).map((o,i)=>
    `<button class="opt" onclick="scriptGo('${o.goto}')">${esc(fill(o.label))}</button>`).join("");
  const next = n.next
    ? `<div class="theysay">Do this now</div><ul class="nextlist">${n.next.map(x=>`<li>${esc(fill(x))}</li>`).join("")}</ul>`
    : "";
  const signals = (id==="dial" || id==="afterdemo")
    ? `<div class="signals"><div class="t">Buying signals — stop selling, close</div><ul style="margin:0;padding-left:16px">
        ${window.BUYING_SIGNALS.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>` : "";

  $("#view").innerHTML = `
    <div class="scriptbar">
      <div class="who">${esc(scriptProspect.businessName)}
        <span>Live call script</span></div>
      <div style="display:flex;gap:7px">
        ${scriptStack.length>1?`<button class="btn-ghost btn-sm" onclick="scriptBack()">‹ Back</button>`:""}
        <button class="btn-ghost btn-sm" onclick="showProspect('${scriptProspect.id}')">Close</button>
      </div>
    </div>

    <div class="stage ${kind}">${esc(n.stage||"")}</div>
    <div class="sayblock ${kind}">
      <div class="saylabel">Say this</div>
      <div class="sayline">${esc(fill(n.say))}</div>
      ${n.why?`<div class="why"><b>Why</b><span>${esc(fill(n.why))}</span></div>`:""}
    </div>
    ${next}
    ${opts?`<div class="theysay">${n.next?"Then":"What do they say?"}</div>${opts}`:""}
    ${signals}`;
  window.scrollTo(0,0);
}

// ---------- client list ----------
async function showList(){
  setTab("clients");
  resetWiz();
  const r = await api("/clients/api/clients");
  if(r.status===401){ sessionStorage.removeItem("adminpw"); location.reload(); return; }
  const clients = await r.json();
  let rows;
  if(!clients.length){
    rows = `<div class="empty"><b>No clients yet.</b>Tap "+ Onboard a client" — it walks you through every step.</div>`;
  } else {
    // NOTE: never interpolate names into inline onclick — an apostrophe in a
    // business name ("Cornel's") breaks the handler. Use data attributes.
    rows = clients.map(c=>`
      <div class="client">
        <div>
          <div class="name">${esc(c.businessName)}</div>
          <div class="meta">${esc(c.ownerName||"")} · ${esc(c.twilioNumber||"")}</div>
        </div>
        <div class="actions">
          <button class="btn-ghost btn-sm js-board" data-url="https://${HOST}/d/${esc(c.dashToken||"")}">Board link</button>
          <button class="btn-danger js-del" data-id="${esc(c.id)}" data-name="${esc(c.businessName)}">Delete</button>
        </div>
      </div>`).join("");
  }
  $("#cClients").textContent = clients.length;
  $("#view").innerHTML = `<div class="toolbar"><h2>Your clients</h2>
    <span class="hint">${clients.length} total</span></div>${rows}`;

  // bind actions (safe for names containing quotes/apostrophes)
  document.querySelectorAll(".js-board").forEach(b=>{
    b.onclick = ()=> copy(b.dataset.url, b);
  });
  document.querySelectorAll(".js-del").forEach(b=>{
    b.onclick = ()=> delClient(b.dataset.id, b.dataset.name);
  });
}
window.delClient = async (id,name)=>{
  if(!confirm(`Delete ${name}? This stops their receptionist.`)) return;
  await api("/clients/api/clients/"+id,{method:"DELETE"});
  showList();
};
$("#newBtn").onclick = ()=>{ resetWiz(); step1(); };

// boot
if(pw){
  fetch("/clients/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pw})})
    .then(r=>r.ok?enter():sessionStorage.removeItem("adminpw"));
}
</script>
